name: Daily Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every day at 6 AM IST (00:30 UTC)
    - cron: '30 0 * * *'

jobs:
  # ─────────────────────────────────────────
  # Job 1: TypeScript + Lint
  # ─────────────────────────────────────────
  typecheck:
    name: 🔷 TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: TypeScript compile check
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Next.js build
        run: npm run build
        env:
          DATABASE_URL: "postgresql://test:test@localhost/test"
          ADMIN_PASSWORD: "ci-test-password"
          ADMIN_SESSION_SECRET: "ci-test-session-secret"

  # ─────────────────────────────────────────
  # Job 2: Unit Tests
  # ─────────────────────────────────────────
  unit-tests:
    name: 🧬 Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Run unit tests
        run: npm test

  # ─────────────────────────────────────────
  # Job 3: Core API Tests
  # ─────────────────────────────────────────
  api-tests:
    name: 🧪 API Route Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://test:test@localhost/test"
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "ci-test-password"
      ADMIN_SESSION_SECRET: "ci-test-session-secret"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps
      - name: Build
        run: npm run build
      - name: Start server in background
        run: npx next start -p 3000 &

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000/; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in time"
          exit 1

      - name: Homepage returns 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/)
          echo "GET / -> $code"
          [ "$code" = "200" ]

      - name: Generator page returns 200
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/generator)
          echo "GET /generator -> $code"
          [ "$code" = "200" ]

      - name: Unauthenticated protected admin API is rejected (401)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/admin/newsletters)
          echo "GET /api/admin/newsletters (no session) -> $code"
          [ "$code" = "401" ]

      - name: Unauthenticated admin page redirects to login
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/admin/dashboard)
          echo "GET /admin/dashboard (no session) -> $code"
          [ "$code" -ge "300" ] && [ "$code" -lt "400" ]

      - name: Login rejects wrong credentials (401)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/admin/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"wrong-password"}')
          echo "Bad login -> $code"
          [ "$code" = "401" ]

      - name: Login accepts correct credentials and issues a session that clears the admin API gate
        run: |
          resp=$(curl -s -i -X POST http://localhost:3000/api/admin/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"ci-test-password"}')
          echo "$resp" | grep -q "HTTP/1.1 200" || (echo "Login did not return 200" && echo "$resp" && exit 1)
          cookie=$(echo "$resp" | tr -d '\r' | grep -i "^set-cookie:" | sed -n 's/.*admin_session=\([^;]*\).*/\1/p')
          if [ -z "$cookie" ]; then echo "No admin_session cookie set on login" && exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/admin/newsletters -H "Cookie: admin_session=$cookie")
          echo "GET /api/admin/newsletters (with session) -> $code"
          # Must NOT be 401 (middleware must let it through) — 500 is acceptable here since
          # there's no real database in CI, we're only asserting the auth gate, not the DB call.
          [ "$code" != "401" ]

      - name: Check critical files exist
        run: |
          files=(
            "app/page.tsx"
            "app/generator/page.tsx"
            "app/api/generate-deployment/route.ts"
            "app/api/ai-assistant/route.ts"
            "components/hero-section.tsx"
            "components/generator-form.tsx"
            "lib/auth.ts"
            "lib/db.ts"
            ".env.example"
          )
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then echo "❌ MISSING: $f"; exit 1; fi
            echo "✅ $f"
          done

  # ─────────────────────────────────────────
  # Job 4: Security Check
  # ─────────────────────────────────────────
  security:
    name: 🔐 Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps

      - name: Dependency vulnerability audit (high/critical fails the build)
        run: npm audit --audit-level=high

      - name: Check no hardcoded secrets
        run: |
          FOUND=0

          # Check 1: No hardcoded password strings (not in template generator files)
          if grep -rn --include="*.ts" --include="*.tsx" -E "passwordHash\s*[:=]\s*\"[^\"]{4,}\"" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git .; then
            echo "❌ Hardcoded password found!"
            FOUND=1
          else
            echo "✅ No hardcoded passwords"
          fi

          # Check 2: No real API keys (sk-, gsk_, xkeysib- patterns)
          if grep -rn --include="*.ts" --include="*.tsx" \
            -E "(\"sk-[a-zA-Z0-9]{20,}\"|\"gsk_[a-zA-Z0-9]{20,}\"|\"xkeysib-[a-zA-Z0-9]{20,}\")" \
            --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.git .; then
            echo "❌ Real API key found!"
            FOUND=1
          else
            echo "✅ No API keys in code"
          fi

          # Check 3: auth.ts uses env variables (not hardcoded)
          if grep -q "process.env.ADMIN_PASSWORD" lib/auth.ts; then
            echo "✅ auth.ts uses env variable"
          else
            echo "❌ auth.ts not using env variable!"
            FOUND=1
          fi

          # Check 4: session tokens are signed (not the old Math.random() generator)
          if grep -q "crypto.subtle" lib/auth.ts; then
            echo "✅ auth.ts signs session tokens"
          else
            echo "❌ auth.ts does not appear to sign session tokens!"
            FOUND=1
          fi

          # Check 5: .env.local not committed
          if [ -f ".env.local" ]; then
            echo "❌ .env.local committed — remove it!"
            FOUND=1
          else
            echo "✅ .env.local not committed"
          fi

          exit $FOUND

  # ─────────────────────────────────────────
  # Job 5: CLI Tests
  # ─────────────────────────────────────────
  cli-tests:
    name: ⚡ CLI Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CLI deps
        run: cd cli && npm install
      - name: Build CLI
        run: cd cli && npm run build
      - name: CLI doctor must not crash (default stack)
        run: |
          cd cli
          timeout 10 node dist/index.js doctor
          echo "✅ CLI doctor ran without crash (default)"
      - name: CLI doctor must not crash (representative stacks)
        run: |
          cd cli
          for stack in nextjs fastapi springboot; do
            echo "--- doctor --stack $stack ---"
            timeout 10 node dist/index.js doctor --stack "$stack"
          done
          echo "✅ CLI doctor ran without crash across stacks"
      - name: Check CLI version
        run: |
          VERSION=$(node -e "console.log(require('./cli/package.json').version)")
          echo "CLI version: $VERSION"

  # ─────────────────────────────────────────
  # Job 6: DB Integration Tests
  # ─────────────────────────────────────────
  # TESTING_ROADMAP.md Phase 3: test API routes against a REAL database
  # instead of mocks or the fake `postgresql://test:test@localhost/test`
  # DATABASE_URL the other jobs use (which just makes every DB-touching route
  # 500 -- fine for auth-gate checks, not for verifying actual dedupe/insert
  # logic).
  #
  # A plain `postgres` service container does NOT work here: this app's DB
  # client (`@neondatabase/serverless`'s `neon()`) is an HTTP driver that only
  # speaks Neon's own protocol -- pointed at vanilla Postgres it fails every
  # query with "TypeError: fetch failed" (confirmed by hand while building
  # this job). Neon's own ephemeral-branch GitHub Actions solve this
  # properly: spin up a real, disposable branch of the actual project for
  # the run, test against it over its native protocol, delete it when done
  # -- the same mechanism Neon recommends for PR preview databases.
  #
  # Requires a `NEON_API_KEY` repo secret (Neon console -> Account Settings
  # -> API keys) and a `NEON_PROJECT_ID` repo variable (repo Settings ->
  # Secrets and variables -> Actions -> Variables tab) -- project id is
  # "curly-wildflower-53845482" for the v0-envsetup-dev-hn project. The job
  # is gated on that variable existing so it skips cleanly (not a failure)
  # rather than breaking CI until those are set up.
  db-integration-tests:
    name: 🗄️ DB Integration Tests
    runs-on: ubuntu-latest
    if: ${{ vars.NEON_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --legacy-peer-deps

      - name: Create an ephemeral Neon branch for this run
        id: neon-branch
        uses: neondatabase/create-branch-action@v6
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ci-integration-${{ github.run_id }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Apply real migrations (same scripts/*.sql used against production) to the branch
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          set -e
          for f in \
            scripts/create-subscribers-table.sql \
            scripts/create-admin-tables.sql \
            scripts/create-suggestions-table.sql \
            scripts/create-ai-usage-table.sql \
            scripts/add-state-column-to-visitors.sql \
            scripts/add-template-column-to-newsletters.sql \
          ; do
            echo "Applying $f"
            psql "$DATABASE_URL" -f "$f"
          done

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url_pooled }}
          ADMIN_USERNAME: "admin"
          ADMIN_PASSWORD: "ci-test-password"
          ADMIN_SESSION_SECRET: "ci-test-session-secret"

      - name: Start server in background
        run: npx next start -p 3000 &
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url_pooled }}
          ADMIN_USERNAME: "admin"
          ADMIN_PASSWORD: "ci-test-password"
          ADMIN_SESSION_SECRET: "ci-test-session-secret"

      - name: Wait for server to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3000/; then
              echo "Server is up"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not become ready in time"
          exit 1

      - name: Subscribe -- first submission is treated as new
        run: |
          resp=$(curl -s -X POST http://localhost:3000/api/subscribe \
            -H "Content-Type: application/json" \
            -d '{"email":"integration-test@example.com"}')
          echo "$resp"
          echo "$resp" | grep -qi "subscribing" || (echo "Expected the first-time welcome message" && exit 1)

      - name: Subscribe -- row actually persisted exactly once
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          count=$(psql "$DATABASE_URL" -tAc \
            "SELECT COUNT(*) FROM subscribers WHERE email = 'integration-test@example.com'")
          echo "subscribers rows: $count"
          [ "$count" = "1" ]

      - name: Subscribe -- duplicate submission is deduped, not a 2nd row
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          resp=$(curl -s -X POST http://localhost:3000/api/subscribe \
            -H "Content-Type: application/json" \
            -d '{"email":"integration-test@example.com"}')
          echo "$resp"
          echo "$resp" | grep -qi "patience" || (echo "Expected the returning-subscriber message, not the welcome one" && exit 1)
          count=$(psql "$DATABASE_URL" -tAc \
            "SELECT COUNT(*) FROM subscribers WHERE email = 'integration-test@example.com'")
          [ "$count" = "1" ]

      - name: Subscribe -- invalid email is rejected before touching the DB
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/subscribe \
            -H "Content-Type: application/json" -d '{"email":"not-an-email"}')
          [ "$code" = "400" ]

      - name: Suggestions -- valid submission is persisted
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/suggestions \
            -H "Content-Type: application/json" \
            -d '{"message":"Add dark mode","email":"integration-test@example.com"}')
          [ "$code" = "200" ]
          count=$(psql "$DATABASE_URL" -tAc \
            "SELECT COUNT(*) FROM suggestions WHERE message = 'Add dark mode'")
          [ "$count" = "1" ]

      - name: Suggestions -- empty message rejected with 400, nothing written
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          before=$(psql "$DATABASE_URL" -tAc "SELECT COUNT(*) FROM suggestions")
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/suggestions \
            -H "Content-Type: application/json" -d '{"message":""}')
          [ "$code" = "400" ]
          after=$(psql "$DATABASE_URL" -tAc "SELECT COUNT(*) FROM suggestions")
          [ "$before" = "$after" ]

      - name: Admin newsletters API -- unauthenticated GET and POST /send are rejected (401)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/admin/newsletters)
          [ "$code" = "401" ]
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/admin/newsletters/send \
            -H "Content-Type: application/json" -d '{"newsletterId":1}')
          [ "$code" = "401" ]

      - name: Admin newsletters API -- authenticated GET returns real data from the DB
        run: |
          resp=$(curl -s -i -X POST http://localhost:3000/api/admin/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"ci-test-password"}')
          cookie=$(echo "$resp" | tr -d '\r' | grep -i "^set-cookie:" | sed -n 's/.*admin_session=\([^;]*\).*/\1/p')
          if [ -z "$cookie" ]; then echo "No admin_session cookie set on login" && exit 1; fi
          echo "ADMIN_COOKIE=$cookie" >> "$GITHUB_ENV"

          body=$(curl -s http://localhost:3000/api/admin/newsletters -H "Cookie: admin_session=$cookie")
          echo "$body"
          echo "$body" | grep -q '"newsletters":\[\]' || (echo "Expected an empty newsletters array from the real DB" && exit 1)

      - name: Admin newsletters send -- authenticated request against a real (draft) newsletter without a Brevo key configured
        env:
          DATABASE_URL: ${{ steps.neon-branch.outputs.db_url }}
        run: |
          newsletter_id=$(psql "$DATABASE_URL" -tAc \
            "INSERT INTO newsletters (title, subject, content, html_content, status) \
             VALUES ('Integration test', 'Test subject', 'body', '<p>body</p>', 'draft') RETURNING id;")
          newsletter_id=$(echo "$newsletter_id" | tr -d '[:space:]')
          echo "Created newsletter id=$newsletter_id"

          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:3000/api/admin/newsletters/send \
            -H "Content-Type: application/json" -H "Cookie: admin_session=$ADMIN_COOKIE" \
            -d "{\"newsletterId\":$newsletter_id}")
          echo "send status: $code"
          # BREVO_API_KEY is deliberately unset in this job (no real secret needed
          # to test the auth+DB wiring) -- the route's own guard should reject with
          # 500 "Email service not configured", not silently succeed or crash.
          [ "$code" = "500" ]

      - name: Delete the ephemeral Neon branch
        if: always() && steps.neon-branch.outputs.branch_id != ''
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.neon-branch.outputs.branch_id }}
          api_key: ${{ secrets.NEON_API_KEY }}
